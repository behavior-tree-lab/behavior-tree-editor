<div ng-controller="PropertiespanelController as propertiespanel" class="side-panel">

  <div class="title">Properties</div>

  <div ng-hide="propertiespanel.block" class="properties">
    <p class="text-center">Select a <strong>single</strong> block to change its properties.</p>
    <p class="text-center"><em>NOTE: The root node represents a tree. Therefore, changes applied to this node will persist on the tree object.</em></p>
  </div>
  
  <div ng-show="propertiespanel.block" class="properties">
    <form>
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" 
               class="form-control"
               name="title"
               placeholder="Title"
               ng-keydown="propertiespanel.keydown($event)"
               ng-model="propertiespanel.block.title"
               ng-change="propertiespanel.update()">
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea name="description"
                  rows="4"
                  class="form-control"
                  placeholder="Description"
                  ng-keydown="propertiespanel.keydown($event)"
                  ng-model="propertiespanel.block.description"
                  ng-change="propertiespanel.update()">

        </textarea>
      </div>

      <!-- Schema-driven typed properties: enums as dropdowns, numbers, bools,
           strings and uint64 lists rendered per the node schema. -->
	  <div class="form-group" ng-if="propertiespanel.isRpcCall">
		<b3-rpc-properties ng-model="propertiespanel.block.properties"
		                   ng-change="propertiespanel.update()">
		</b3-rpc-properties>
	  </div>

      <div class="form-group" ng-if="propertiespanel.hasSchema && !propertiespanel.isRpcCall">
        <b3-typed-properties heading="Properties"
                             node-name="propertiespanel.block.name"
                             ng-model="propertiespanel.block.properties"
                             ng-change="propertiespanel.update()"
                             class="no-border">
        </b3-typed-properties>
      </div>

      <!-- Fallback for custom / unknown nodes with no schema: generic table. -->
      <div class="form-group" ng-if="!propertiespanel.hasSchema && !propertiespanel.isRpcCall">
        <b3-key-table heading="Properties"
                      ng-model="propertiespanel.block.properties"
                      ng-change="propertiespanel.update()"
                      class="no-border">
        </b3-key-table>
      </div>
    </form>
  </div>
  
</div>
